  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255, 43, 43, 0.12),
          transparent 35%
        ),
        #070707;
      color: #f5f5f5;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .thankyou-wrapper {
      width: 100%;
      max-width: 900px;
      padding: 30px;
      text-align: center;
    }

    .card {
      position: relative;

      padding: 70px 50px;

      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.06),
          rgba(255,255,255,0.02)
        );

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.55),
        0 0 80px rgba(255,43,43,0.08);
    }

    .check {
      width: 90px;
      height: 90px;

      margin: 0 auto 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(255,43,43,0.12);

      border: 1px solid rgba(255,43,43,0.35);

      color: #ff2b2b;

      font-size: 42px;

      box-shadow:
        0 0 40px rgba(255,43,43,0.18);
    }

    .small-label {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;

      color: #ff2b2b;

      margin-bottom: 18px;
      font-weight: 600;
    }

    h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 0.95;

      letter-spacing: -3px;

      margin-bottom: 25px;
    }

    h1 span {
      color: #ff2b2b;
    }

    .description {
      max-width: 600px;
      margin: 0 auto;

      color: #a1a1a1;

      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      margin-top: 38px;

      padding: 15px 28px;

      border-radius: 50px;

      background: #ff2b2b;
      color: #fff;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition: 0.3s ease;

      box-shadow:
        0 10px 30px rgba(255,43,43,0.22);
    }

    .button:hover {
      background: #c91515;

      transform: translateY(-3px);

      box-shadow:
        0 15px 40px rgba(255,43,43,0.35);
    }

    .footer {
      margin-top: 28px;

      font-size: 12px;

      color: #666;
    }

    @media (max-width: 600px) {

      body {
        overflow: auto;
      }

      .thankyou-wrapper {
        padding: 20px;
      }

      .card {
        padding: 50px 25px;
        border-radius: 22px;
      }

      .check {
        width: 75px;
        height: 75px;
        font-size: 34px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .description {
        font-size: 15px;
      }

    }

  </style>
